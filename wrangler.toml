# Cloudflare Pages configuration for masizo-site.
#
# Deployment model: static Astro output in dist/ + Pages Functions in /functions
# (POST /api/lead). See README.md for the full Cloudflare setup steps.
#
# SECRETS ARE NEVER COMMITTED. RESEND_API_KEY is set as an encrypted secret in
# the Cloudflare Pages dashboard (Settings > Environment variables) or via:
#   npx wrangler pages secret put RESEND_API_KEY

name = "masizo-site"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[vars]
# Where lead notifications are delivered (owner inbox, handoff §2).
LEAD_EMAIL_TO = "office@masizodevelopment.com"
# Sender for lead notifications. PLACEHOLDER — [VERIFY] must be an address on a
# domain verified in the Masizo-owned Resend account before go-live.
LEAD_EMAIL_FROM = "leads@masizodevelopment.com"

# KV namespace for loss-proof lead storage (written BEFORE any email attempt):
# the LEADS binding is configured in the Cloudflare Pages dashboard
# (Settings > Bindings > KV namespace "LEADS" -> masizo-leads), NOT here —
# a kv_namespaces block in this file would override the dashboard binding and
# requires a hardcoded namespace id. For local dev: npx wrangler pages dev dist --kv LEADS
